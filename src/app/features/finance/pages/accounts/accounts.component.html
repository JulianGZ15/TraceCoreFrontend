<tc-list-container tableLabel="Cuentas de crédito">
  <tc-page-heading
    listHeader
    [title]="title"
    section="ADMINISTRACIÓN FINANCIERA"
    description="Facturas administrativas, pagos, aplicaciones y crédito con importes exactos."
  >
    <tc-finance-section-nav
      [base]="navBase"
      [sections]="sections"
      [currency]="mode === 'party' ? currency : ''"
    />
  </tc-page-heading>

  <ng-container listFeedback>
    <tc-finance-pending-requests />
    @if (error()) {
      <tc-feedback [message]="error()" />
    }
    @if (loading()) {
      <p role="status">Consultando…</p>
    }
  </ng-container>

  <tc-search-toolbar
    listToolbar
    [showSearch]="false"
  label="Filtros de cuentas de crédito"
  [chips]="chips()"
  [count]="activeFilterCount()"
  [busy]="loading()"
  (openFilters)="openFilters(filterDrawerTpl)"
  (remove)="onRemoveChip($event)"
  (clear)="onClearAll()"
>
  @if (can('FINANCE_CREDIT')) {
    <button toolbarAction class="btn primary" (click)="action('account')">
      Crear cuenta DRAFT
    </button>
  }
  <button toolbarAction class="btn secondary" [disabled]="loading()" (click)="reload()">
    Recargar
  </button>
</tc-search-toolbar>

<ng-template #filterDrawerTpl>
  <form [formGroup]="drawerForm">
    <tc-filter-section title="Contraparte y moneda">
      <div class="field">
        <tc-finance-lookup
          title="Tercero"
          [value]="drawerForm.controls.partyUuid.value"
          (selectedChange)="onPartyPicked($event)"
        />
      </div>

      <div class="field">
        <label for="account-currency">Divisa</label>
        <select id="account-currency" formControlName="currency">
          <option value="">Todas</option>
          @for (c of currencies(); track c.uuid) {
            <option [value]="c.code">{{ c.code }}</option>
          }
        </select>
      </div>

      <div class="field">
        <label>Dirección</label>
        <div class="pill-group" role="group" aria-label="Dirección de la cuenta">
          <button
            type="button"
            class="pill-option"
            [class.active]="drawerForm.controls.direction.value === ''"
            (click)="setDraftDirection('')"
          >
            Ambas
          </button>
          <button
            type="button"
            class="pill-option"
            [class.active]="drawerForm.controls.direction.value === 'RECEIVABLE'"
            (click)="setDraftDirection('RECEIVABLE')"
          >
            Por cobrar
          </button>
          <button
            type="button"
            class="pill-option"
            [class.active]="drawerForm.controls.direction.value === 'PAYABLE'"
            (click)="setDraftDirection('PAYABLE')"
          >
            Por pagar
          </button>
        </div>
      </div>
    </tc-filter-section>

    <tc-filter-section title="Estado de la cuenta">
      <div class="pill-group" role="group" aria-label="Estado de la cuenta">
        <button
          type="button"
          class="pill-option"
          [class.active]="drawerForm.controls.state.value === ''"
          (click)="setDraftState('')"
        >
          Todos
        </button>
        <button
          type="button"
          class="pill-option"
          [class.active]="drawerForm.controls.state.value === 'DRAFT'"
          (click)="setDraftState('DRAFT')"
        >
          Borrador
        </button>
        <button
          type="button"
          class="pill-option"
          [class.active]="drawerForm.controls.state.value === 'ACTIVE'"
          (click)="setDraftState('ACTIVE')"
        >
          Activa
        </button>
        <button
          type="button"
          class="pill-option"
          [class.active]="drawerForm.controls.state.value === 'BLOCKED'"
          (click)="setDraftState('BLOCKED')"
        >
          Bloqueada
        </button>
      </div>
    </tc-filter-section>
  </form>
</ng-template>

  <tc-finance-records
    listTable
    [rows]="rows()"
    [columns]="columns"
    (selected)="open($event)"
  />
  <tc-pagination
    listPagination
    [offset]="offset"
    [limit]="limit"
    [count]="rows().length"
    (move)="move($event)"
  />
</tc-list-container>
