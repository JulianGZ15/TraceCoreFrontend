<tc-list-container tableLabel="Divisas y precisión">
  <tc-page-heading
    listHeader
    [title]="title"
    section="ADMINISTRACIÓN FINANCIERA"
    description="Facturas administrativas, pagos, aplicaciones y crédito con importes exactos."
  >
    <tc-finance-section-nav
      [base]="navBase"
      [sections]="sections"
      [currency]="mode === 'party' ? currency : ''"
    />
  </tc-page-heading>

  <ng-container listFeedback>
    <tc-finance-pending-requests />
    @if (error()) {
      <tc-feedback [message]="error()" />
    }
    @if (loading()) {
      <p role="status">Consultando…</p>
    }
  </ng-container>

  <div listToolbar class="currencies-toolbar flex items-center justify-between gap-4 py-2">
    <p class="text-sm">La precisión es inmutable. Las operaciones se mantienen separadas por divisa.</p>
    @if (can('FINANCE_MANAGE')) {
      <button class="btn primary" (click)="action('currency')">Registrar divisa</button>
    }
  </div>

  <tc-finance-records
    listTable
    [rows]="rows()"
    [columns]="columns"
    (selected)="open($event)"
  />
  <tc-pagination
    listPagination
    [offset]="offset"
    [limit]="limit"
    [count]="rows().length"
    (move)="move($event)"
  />
</tc-list-container>
