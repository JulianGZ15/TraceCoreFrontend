<tc-page-heading
  [title]="title"
  section="ADMINISTRACIÓN FINANCIERA"
  description="Facturas administrativas, pagos, aplicaciones y crédito con importes exactos.">
  <tc-finance-section-nav
    [base]="navBase"
    [sections]="sections"
    [currency]="mode === 'party' ? currency : ''"
  />
</tc-page-heading>
<tc-finance-pending-requests />
@if (error()) {
  <tc-feedback [message]="error()" />
}
@if (loading()) {
  <p role="status">Consultando…</p>
}
@if (current(); as d) {
  <section class="panel">
    <h2>{{ note()?.['folio'] }}</h2>
    <p>{{ note()?.['reason'] }}</p>
    <p>
      Total {{ numberText(note()?.['totalAmountExact']) }} ·
      {{ d['reversed'] ? 'Revertida' : 'Vigente' }}
    </p>
    <a [routerLink]="['/finanzas/facturas', note()?.['invoiceUuid']]">Abrir factura</a>
    @if (can('FINANCE_APPROVE') && !d['reversed']) {
      <button class="btn secondary" (click)="reverseNote()">Revertir nota</button>
    }
  </section>
}
<section class="panel">
  <tc-finance-records [rows]="rows()" [columns]="columns" (selected)="open($event)" /><tc-pagination
    [offset]="offset"
    [limit]="limit"
    [count]="rows().length"
    (move)="move($event)"
  />
</section>
