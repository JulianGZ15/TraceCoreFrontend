<tc-feedback [message]="error()" /><tc-feedback [message]="success()" kind="success" />
@if (error()) {
  <button class="btn secondary" (click)="load()">Reintentar consulta</button>
}
@if (ready() && store.profile(); as profile) {
  <tc-equipment-asset-header [profile]="profile">
    @if (session.qualityRead()) {
      <a headerAction class="btn secondary" [routerLink]="['/calidad/equipos', profile.asset.uuid, 'resumen']"
        >Calidad y mantenimiento</a
      >
    }
    <tc-equipment-section-navigation
      [uuid]="profile.asset.uuid"
    />
  </tc-equipment-asset-header>
  <router-outlet />
} @else if (!error()) {
  <p role="status">Cargando expediente…</p>
}

@if (store.profile()?.asset?.uuid; as documentSubjectUuid) { <tc-contextual-links kind="ASSET" [uuid]="documentSubjectUuid"/> }
