<div class="lookup">
  <tc-entity-search
    [label]="label()"
    [placeholder]="'Buscar ' + label().toLocaleLowerCase() + '…'"
    [value]="selected()"
    [selectedLabel]="selectedLabel() || (selected() ? 'Registro seleccionado' : '')"
    [searchError]="error()"
    [optionsList]="suggestions()"
    [searchFn]="searchOptions"
    [disabled]="disabled || busy()"
    (select)="choose($event)"
  />
  @if (busy()) { <small role="status">Buscando opciones…</small> }
  <tc-feedback [message]="error()" />
</div>
