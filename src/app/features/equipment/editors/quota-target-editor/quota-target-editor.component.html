<div class="dialog"><div class="dialog-header"><div><p class="eyebrow">Catálogo técnico y equipos</p><h2>{{data.title}}</h2></div><button type="button" class="icon-button" aria-label="Cerrar formulario" (click)="close()">×</button></div><tc-feedback [message]="error()"/><form [formGroup]="form" (ngSubmit)="submit()"><p>El destino se establece una vez. Para corregirlo debes revocar esta cuota y crear otra.</p><div class="field"><label for="target">Tipo de destino técnico</label><select id="target" formControlName="target"><option value="CATEGORY">Categoría</option><option value="MODEL">Modelo</option></select></div><tc-equipment-lookup kind="category" [label]="form.controls.target.value==='CATEGORY'?'Categoría de destino':'Filtrar modelos por categoría'" formControlName="categoryUuid" (picked)="categoryChanged($event)"/>@if(form.controls.target.value==='MODEL'){<tc-equipment-lookup kind="model" label="Modelo de destino" [filters]="modelFilters()" formControlName="modelUuid"/>}@if(form.invalid && form.touched){<p class="field-error" role="alert">Revisa los campos obligatorios y su formato.</p>}

<div class="dialog-actions">@if(conflict() && data.reload){<button type="button" class="btn secondary" [disabled]="busy()" (click)="reload()">Recargar datos</button>}<button class="btn secondary" type="button" [disabled]="busy()" (click)="close()">Cancelar</button><button class="btn primary" [disabled]="busy()">{{busy()?'Guardando…':'Guardar'}}</button></div></form></div>
