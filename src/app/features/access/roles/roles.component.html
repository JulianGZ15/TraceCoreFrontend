<tc-page-heading
  section="Acceso"
  title="Roles y permisos"
  description="Cada rol agrupa capacidades. El alcance se define al asignarlo a un usuario."
  ><button class="btn primary" (click)="create()">+ Nuevo rol</button></tc-page-heading
><tc-feedback [message]="list.error()" /><tc-feedback [message]="list.success()" kind="success" />
<section class="panel table-panel" [attr.aria-busy]="list.busy()">
  <div class="panel-heading">
    <h2>Roles de acceso</h2>
    @if (list.busy()) {
      <span role="status">Cargando…</span>
    }
  </div>
  <tc-data-table label="Tabla de roles" appearance="embedded" [busy]="list.busy()">
    @if (list.busy() && !list.items().length) {
      <tc-skeleton variant="table" [columns]="3" label="Cargando registros…" />
    }
    <table [hidden]="list.busy() && !list.items().length">
      <caption class="sr-only">
        Roles de acceso
      </caption>
      <thead>
        <tr>
          <th scope="col">Nombre</th>
          <th scope="col">Código</th>
          <th scope="col">Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (role of list.items(); track role.uuid) {
          <tr>
            <td>{{ role.name }}</td>
            <td class="mono">{{ role.code }}</td>
            <td class="table-actions">
              <button class="btn secondary" (click)="permissions(role)">Gestionar permisos</button>
            </td>
          </tr>
        } @empty {
          @if (!list.busy() && !list.error()) {
            <tr>
              <td colspan="3" class="empty-state">Todavía no hay roles.</td>
            </tr>
          }
        }
      </tbody>
    </table>

    <tc-pagination
      tableFooter
      [offset]="list.offset()"
      [limit]="list.limit()"
      [count]="list.items().length"
      [busy]="list.busy()"
      (move)="list.load($event)"
      (resize)="list.resize($event)"
    />
  </tc-data-table>
</section>
