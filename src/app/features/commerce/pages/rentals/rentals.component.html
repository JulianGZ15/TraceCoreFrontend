<tc-page-heading
  section="Centro comercial"
  [title]="title"
  description="Documentos administrativos, cumplimiento y trazabilidad por patio."
/>
<tc-commerce-section-nav
  [base]="navBase"
  [sections]="sections"
/>
<tc-commerce-pending-requests />
<tc-feedback [message]="error()" />

<tc-search-toolbar
  [showSearch]="false"
  label="Filtros de rentas"
  [chips]="chips()"
  [count]="activeFilterCount()"
  [busy]="loading()"
  (openFilters)="openFilters(filterDrawerTpl)"
  (remove)="onRemoveChip($event)"
  (clear)="onClearAll()"
>
  <div toolbarContext class="field toolbar-yard">
    <label for="rental-yard-select" class="sr-only">Patio</label>
    <select id="rental-yard-select" #y [value]="yard" (change)="update('yardUuid', y.value)">
      @for (item of yards; track item.uuid) {
        <option [value]="item.uuid">{{ item.code }} · {{ item.name }}</option>
      }
    </select>
  </div>

  <button toolbarAction class="btn secondary" [disabled]="loading()" (click)="reload()">
    Recargar
  </button>
</tc-search-toolbar>

<ng-template #filterDrawerTpl>
  <form [formGroup]="drawerForm">
    <tc-filter-section title="Estado del contrato">
      <div class="pill-group" role="group" aria-label="Estado del contrato">
        <button
          type="button"
          class="pill-option"
          [class.active]="drawerForm.controls.state.value === ''"
          (click)="setDraftState('')"
        >
          Todos
        </button>
        <button
          type="button"
          class="pill-option"
          [class.active]="drawerForm.controls.state.value === 'DRAFT'"
          (click)="setDraftState('DRAFT')"
        >
          Borrador
        </button>
        <button
          type="button"
          class="pill-option"
          [class.active]="drawerForm.controls.state.value === 'ACTIVE'"
          (click)="setDraftState('ACTIVE')"
        >
          Activo
        </button>
        <button
          type="button"
          class="pill-option"
          [class.active]="drawerForm.controls.state.value === 'CLOSED'"
          (click)="setDraftState('CLOSED')"
        >
          Cerrado
        </button>
        <button
          type="button"
          class="pill-option"
          [class.active]="drawerForm.controls.state.value === 'CANCELLED'"
          (click)="setDraftState('CANCELLED')"
        >
          Cancelado
        </button>
      </div>
    </tc-filter-section>

    <tc-filter-section title="Partes involucradas">
      <div class="field">
        <tc-commerce-lookup
          resource="party-options"
          [yard]="yard"
          [params]="{ purpose: 'CONTRACTOR' }"
          title="Contratante"
          [value]="drawerForm.controls.partyUuid.value"
          (selectedChange)="onPartyPicked('partyUuid', $event)"
        />
      </div>

      <div class="field">
        <tc-commerce-lookup
          resource="party-options"
          [yard]="yard"
          [params]="{ purpose: 'DISTRIBUTOR' }"
          title="Distribuidor"
          [value]="drawerForm.controls.distributorUuid.value"
          (selectedChange)="onPartyPicked('distributorUuid', $event)"
        />
      </div>

      <div class="field">
        <tc-commerce-lookup
          resource="party-options"
          [yard]="yard"
          [params]="{ purpose: 'END_CUSTOMER' }"
          title="Cliente final"
          [value]="drawerForm.controls.endCustomerUuid.value"
          (selectedChange)="onPartyPicked('endCustomerUuid', $event)"
        />
      </div>
    </tc-filter-section>
  </form>
</ng-template>

@if (loading()) {
  <p role="status">Cargando…</p>
}
<tc-commerce-records
  [rows]="rows()"
  [columns]="columns"
  (selected)="selected.set($event)"
/>
<tc-pagination
  [offset]="offset"
  [limit]="limit"
  [count]="rows().length"
  [busy]="loading()"
  (move)="move($event)"
/>
@if (selected(); as row) {
  <section class="selection">
    <h2>{{ row.folio || row.concept || row.filename || 'Registro seleccionado' }}</h2>
    <p class="mono">{{ row.uuid }} · versión {{ row.version }}</p>
    <div class="toolbar">
      <a [routerLink]="'/comercial/rentas/' + row.uuid + '/general'">Abrir renta</a>
    </div>
  </section>
}
