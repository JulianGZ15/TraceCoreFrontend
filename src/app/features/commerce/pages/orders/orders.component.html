<tc-list-container tableLabel="Órdenes comerciales">
  <tc-page-heading
    listHeader
    section="Centro comercial"
    [title]="title"
    description="Documentos administrativos, cumplimiento y trazabilidad por patio."
  >
    <tc-commerce-section-nav
      [base]="navBase"
      [sections]="sections"
    />
  </tc-page-heading>

  <ng-container listFeedback>
    <tc-commerce-pending-requests />
    <tc-feedback [message]="error()" />
    @if (loading()) {
      <p role="status">Cargando…</p>
    }
  </ng-container>

  <tc-search-toolbar
    listToolbar
    label="Buscar órdenes por folio o serie"
    placeholder="Folio o serie de la orden…"
    [value]="filters['search']"
    [chips]="chips()"
    [count]="activeFilterCount()"
    [busy]="loading()"
    (search)="onSearch($event)"
    (openFilters)="openFilters(filterDrawerTpl)"
    (remove)="onRemoveChip($event)"
    (clear)="onClearAll()"
  >
    <div toolbarContext class="field toolbar-yard">
      <label for="order-yard-select" class="sr-only">Patio</label>
      <select id="order-yard-select" #y [value]="yard" (change)="update('yardUuid', y.value)">
        @for (item of yards; track item.uuid) {
          <option [value]="item.uuid">{{ item.code }} · {{ item.name }}</option>
        }
      </select>
    </div>

    @if (can('COMMERCIAL_MANAGE')) {
      <a
        toolbarAction
        class="btn primary"
        routerLink="/comercial/ordenes/nueva"
        [queryParams]="{ yardUuid: yard }"
      >
        Nueva orden
      </a>
    }
    <button toolbarAction class="btn secondary" [disabled]="loading()" (click)="reload()">
      Recargar
    </button>
  </tc-search-toolbar>

<ng-template #filterDrawerTpl>
  <form [formGroup]="drawerForm">
    <tc-filter-section title="Tipo de orden">
      <div class="pill-group" role="group" aria-label="Tipo de orden">
        <button
          type="button"
          class="pill-option"
          [class.active]="drawerForm.controls.type.value === ''"
          (click)="setDraftType('')"
        >
          Todos
        </button>
        <button
          type="button"
          class="pill-option"
          [class.active]="drawerForm.controls.type.value === 'OC'"
          (click)="setDraftType('OC')"
        >
          Compra
        </button>
        <button
          type="button"
          class="pill-option"
          [class.active]="drawerForm.controls.type.value === 'OV'"
          (click)="setDraftType('OV')"
        >
          Venta
        </button>
        <button
          type="button"
          class="pill-option"
          [class.active]="drawerForm.controls.type.value === 'OR'"
          (click)="setDraftType('OR')"
        >
          Renta
        </button>
      </div>
    </tc-filter-section>

    <tc-filter-section title="Estado de la orden">
      <div class="pill-group" role="group" aria-label="Estado de la orden">
        <button
          type="button"
          class="pill-option"
          [class.active]="drawerForm.controls.state.value === ''"
          (click)="setDraftState('')"
        >
          Todos
        </button>
        <button
          type="button"
          class="pill-option"
          [class.active]="drawerForm.controls.state.value === 'DRAFT'"
          (click)="setDraftState('DRAFT')"
        >
          Borrador
        </button>
        <button
          type="button"
          class="pill-option"
          [class.active]="drawerForm.controls.state.value === 'APPROVED'"
          (click)="setDraftState('APPROVED')"
        >
          Aprobada
        </button>
        <button
          type="button"
          class="pill-option"
          [class.active]="drawerForm.controls.state.value === 'CLOSED'"
          (click)="setDraftState('CLOSED')"
        >
          Cerrada
        </button>
        <button
          type="button"
          class="pill-option"
          [class.active]="drawerForm.controls.state.value === 'CANCELLED'"
          (click)="setDraftState('CANCELLED')"
        >
          Cancelada
        </button>
      </div>
    </tc-filter-section>

    <tc-filter-section title="Contraparte">
      <div class="field">
        <tc-commerce-lookup
          resource="party-options"
          [yard]="yard"
          [params]="{ purpose: 'CONTRACTOR' }"
          title="Contraparte"
          [value]="drawerForm.controls.partyUuid.value"
          (selectedChange)="onPartyPicked($event)"
        />
      </div>
    </tc-filter-section>
  </form>
</ng-template>

  <tc-commerce-records
    listTable
    [rows]="rows()"
    [columns]="columns"
    (selected)="selected.set($event)"
  />
  <tc-pagination
    listPagination
    [offset]="offset"
    [limit]="limit"
    [count]="rows().length"
    [busy]="loading()"
    (move)="move($event)"
  />
</tc-list-container>
@if (selected(); as row) {
  <section class="selection">
    <h2>{{ row.folio || row.concept || row.filename || 'Registro seleccionado' }}</h2>
    <p class="mono">{{ row.uuid }} · versión {{ row.version }}</p>
    <div class="toolbar">
      <a [routerLink]="'/comercial/ordenes/' + row.uuid + '/general'">Abrir expediente</a>
    </div>
  </section>
}
