<tc-page-heading section="RFID e integración" title="Autorizar sesión" description="El conector autenticado realizará la captura; Angular no controla el lector físico."/><tc-rfid-nav/><tc-feedback [message]="error()"/><tc-feedback [message]="success()" kind="success"/>@if(busy()){<p role="status">Consultando…</p>}<tc-rfid-pending/><form class="panel form-page" [formGroup]="form" (ngSubmit)="save()"><div class="form-grid"><label class="field"><span>Patio</span><select formControlName="yardUuid" (change)="pick('yardUuid',$any($event.target).value)"><option value="">Seleccionar…</option>@for(y of session.context()?.yards??[];track y.uuid){@if(y.active&&access.can('RFID_READ',y.uuid)&&access.can('RFID_SCAN',y.uuid)){<option [value]="y.uuid">{{y.code}} · {{y.name}}</option>}}</select></label><label class="field"><span>Propósito</span><select formControlName="purpose"><option value="IDENTIFY">Identificar</option><option value="COUNT">Conteo</option><option value="GATE">Portón</option></select></label><tc-rfid-picker kind="READERS" label="Lector elegible" [yardUuid]="form.controls.yardUuid.value" [value]="form.controls.readerUuid.value" (selected)="pick('readerUuid',$event)"/><tc-rfid-picker kind="DEVICES" label="Instalación con credencial" [yardUuid]="form.controls.yardUuid.value" [readerUuid]="form.controls.readerUuid.value" [value]="form.controls.deviceUuid.value" (selected)="pick('deviceUuid',$event)"/>@if(form.controls.purpose.value==='GATE'){<tc-rfid-picker kind="GATES" label="Portón" [yardUuid]="form.controls.yardUuid.value" [value]="form.controls.gateUuid.value" (selected)="pick('gateUuid',$event)"/>}<label class="field"><span>Vencimiento (máximo una hora)</span><input type="datetime-local" formControlName="expiresAt"/></label><label class="field"><span>Desplazamiento UTC de captura</span><input formControlName="utcOffset" placeholder="+00:00"/></label></div><footer class="actions"><button type="button" class="btn" [disabled]="busy()" (click)="cancel()">Cancelar</button><button class="btn primary" [disabled]="busy()">Autorizar</button></footer></form>
