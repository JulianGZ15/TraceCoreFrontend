<tc-page-heading section="RFID e integración" title="Portón" description="Configuración lógica; no controla una barrera física."><tc-rfid-nav/></tc-page-heading><tc-feedback [message]="error()"/><tc-feedback [message]="success()" kind="success"/>@if(busy()){<p role="status">Consultando…</p>}<tc-rfid-pending/>@if(row();as r){<section class="panel"><h2>{{r.data.code}} · {{r.data.name}}</h2><p class="mono">{{r.data.uuid}}</p><p>Patio: {{r.data.yardUuid}}</p><p>{{r.data.active?"Activo":"Inactivo"}}</p><a class="btn" routerLink="/rfid/sesiones/nueva" [queryParams]="{yardUuid:r.data.yardUuid,gateUuid:r.data.uuid,purpose:'GATE'}">Autorizar sesión de portón</a></section>}
