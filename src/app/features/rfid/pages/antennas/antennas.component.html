<tc-page-heading section="RFID e integración" title="Antenas" description="Configuración y entregas del servicio RFID."/><tc-rfid-nav/><tc-feedback [message]="error()"/><tc-feedback [message]="success()" kind="success"/>@if(busy()){<p role="status">Consultando…</p>}<tc-rfid-pending/>@if(!available()){<tc-feedback message="Servicio RFID no disponible. Su situación es desconocida."/>}<button class="btn" [disabled]="busy()" (click)="load()">Actualizar</button><button class="btn primary" [disabled]="busy()" (click)="create()">Nuevo registro</button><div class="panel table-wrap" tabindex="0" aria-label="Antenas"><table><thead><tr><th>Identidad</th><th>UUID</th><th>Estado</th><th>Versión</th><th>Acción</th></tr></thead><tbody>@for(r of rows();track r.uuid){<tr><td>{{r.antenna?.name}}</td><td>{{r.uuid}}</td><td>{{r.antenna?.active?'Activo':'Inactivo'}}</td><td>{{r.version}}</td><td><a class="btn" [routerLink]="['/rfid/antenas',r.uuid]">Consultar</a></td></tr>}@empty{<tr><td colspan="6" class="empty">Sin datos disponibles para esta consulta.</td></tr>}</tbody></table></div><tc-pagination [offset]="offset()" [limit]="limit()" [count]="rows().length" [busy]="busy()" (move)="page($event)" (resize)="filter({limit:$event.toString()})"/>
