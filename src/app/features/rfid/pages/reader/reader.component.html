<tc-page-heading section="RFID e integración" title="Lector" description="Identidad inmutable; cambios controlados por versión."/><tc-rfid-nav/><tc-feedback [message]="error()"/><tc-feedback [message]="success()" kind="success"/>@if(busy()){<p role="status">Consultando…</p>}<tc-rfid-pending/>@if(!available()){<tc-feedback message="Servicio RFID no disponible; no conocemos su configuración actual."/>}<button class="btn" [disabled]="busy()" (click)="load()">Actualizar</button>@if(row();as r){<section class="panel"><h2>Configuración</h2><dl><dt>UUID</dt><dd class="mono">{{r.uuid}}</dd><dt>Versión</dt><dd>{{r.version}}</dd><dt>Código</dt><dd>{{r.reader?.code}}</dd><dt>Nombre</dt><dd>{{r.reader?.name}}</dd><dt>Tipo</dt><dd>{{r.reader?.kind}}</dd><dt>Patio</dt><dd>{{r.reader?.yardUuid}}</dd></dl><div class="actions"><button class="btn primary" [disabled]="busy()" (click)="edit()">Editar configuración</button></div></section>}
