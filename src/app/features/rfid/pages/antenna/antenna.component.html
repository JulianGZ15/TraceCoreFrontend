<tc-page-heading section="RFID e integración" title="Antena" description="Identidad inmutable; cambios controlados por versión."><tc-rfid-nav/></tc-page-heading><tc-feedback [message]="error()"/><tc-feedback [message]="success()" kind="success"/>@if(busy()){<p role="status">Consultando…</p>}<tc-rfid-pending/>@if(!available()){<tc-feedback message="Servicio RFID no disponible; no conocemos su configuración actual."/>}<button class="btn" [disabled]="busy()" (click)="load()">Actualizar</button>@if(row();as r){<section class="panel"><h2>Configuración</h2><dl><dt>UUID</dt><dd class="mono">{{r.uuid}}</dd><dt>Versión</dt><dd>{{r.version}}</dd><dt>Lector</dt><dd>{{r.antenna?.readerUuid}}</dd><dt>Puerto</dt><dd>{{r.antenna?.port}}</dd><dt>Nombre</dt><dd>{{r.antenna?.name}}</dd><dt>Portón</dt><dd>{{r.antenna?.gateUuid??'Sin portón'}}</dd></dl><div class="actions"><button class="btn primary" [disabled]="busy()" (click)="edit()">Editar configuración</button></div></section>}
