<tc-list-container tableLabel="Lectores">
  <tc-page-heading
    listHeader
    section="RFID e integración"
    title="Lectores"
    description="Configuración y entregas del servicio RFID."
  >
    <button class="btn" [disabled]="busy()" (click)="load()">Actualizar</button>
    <button class="btn primary" [disabled]="busy()" (click)="create()">Nuevo registro</button>
    <tc-rfid-nav />
  </tc-page-heading>

  <ng-container listFeedback>
    <tc-feedback [message]="error()" />
    <tc-feedback [message]="success()" kind="success" />

    @if (busy()) {
      <p role="status">Consultando…</p>
    }

    <tc-rfid-pending />

    @if (!available()) {
      <tc-feedback message="Servicio RFID no disponible. Su situación es desconocida." />
    }
  </ng-container>

  <div listTable class="table-wrap" tabindex="0" aria-label="Lectores">
    <table>
      <thead>
        <tr>
          <th>Identidad</th>
          <th>UUID</th>
          <th>Estado</th>
          <th>Versión</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody>
        @for (r of rows(); track r.uuid) {
          <tr>
            <td>{{ r.reader?.code }}</td>
            <td>{{ r.uuid }}</td>
            <td>{{ r.reader?.active ? 'Activo' : 'Inactivo' }}</td>
            <td>{{ r.version }}</td>
            <td>
              <a class="btn" [routerLink]="['/rfid/lectores', r.uuid]">Consultar</a>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="5" class="empty">Sin datos disponibles para esta consulta.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  <tc-pagination
    listPagination
    [offset]="offset()"
    [limit]="limit()"
    [count]="rows().length"
    [busy]="busy()"
    (move)="page($event)"
    (resize)="filter({ limit: $event.toString() })"
  />
</tc-list-container>
