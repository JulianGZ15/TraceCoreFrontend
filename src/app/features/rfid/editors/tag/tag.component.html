<form [formGroup]="form" (ngSubmit)="save()" class="dialog-form"><header class="dialog-header"><h2>Registrar chip</h2></header><div class="dialog-body"><tc-feedback [message]="error()"/><div class="form-grid"><tc-rfid-picker kind="MODELS" label="Modelo de chip" [value]="form.controls.modelUuid.value" (selected)="pick('modelUuid',$event)"/>@if(form.get("modelUuid")?.invalid&&form.get("modelUuid")?.touched){<p class="field-error">Revisa modelo de chip.</p>}<label class="field"><span>TID de fábrica</span><input formControlName="tid" type="text"/></label>@if(form.get("tid")?.invalid&&form.get("tid")?.touched){<p class="field-error">Revisa tid de fábrica.</p>}</div>@if(conflict()){<p>Conservamos el borrador. Consulta la versión actual antes de confirmar otra vez.</p>}</div><footer class="dialog-actions"><button type="button" class="btn" [disabled]="busy()" (click)="cancel()">Cancelar</button><button class="btn primary" [disabled]="busy()||!canWrite()">Guardar</button></footer></form>
