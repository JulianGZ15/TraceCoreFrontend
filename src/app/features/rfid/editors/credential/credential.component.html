<section class="dialog-form"><header class="dialog-header"><h2>Credencial nueva de instalación</h2></header><div class="dialog-body"><p>Se muestra una sola vez. La credencial anterior dejó de ser válida. No guardamos este secreto en el navegador.</p><label class="field"><span>Credencial</span><textarea readonly [value]="token()" autocomplete="off"></textarea></label><tc-feedback [message]="message()"/></div><footer class="dialog-actions"><button class="btn" (click)="copy()">Copiar credencial</button><button class="btn primary" (click)="close()">Cerrar y borrar</button></footer></section>
