@if(pending.records().length){<section class="panel" aria-label="Solicitudes pendientes"><h2>Respuesta sin confirmar</h2><p>Consulta el resultado antes de repetir. Conservamos el UUID y los datos originales durante esta sesión.</p>@for(r of pending.records();track r.uuid){<div class="actions"><span class="mono">{{r.uuid}} · {{r.path}}</span><button class="btn" [disabled]="busy()" (click)="recover(r)">Consultar resultado</button><button class="btn" [disabled]="busy()" (click)="repeat(r)">Repetir misma solicitud</button></div>}<tc-feedback [message]="message()"/></section>}
