<section class="evidence-picker" [attr.aria-busy]="busy()">
  <h3>Evidencia vinculada</h3>
  <p class="small-muted">
    Carga los archivos en la sección Evidencias. Solo se muestran los de este tercero.
  </p>
  <tc-feedback [message]="error()" />
  <tc-entity-search
    label="Archivo de evidencia"
    placeholder="Buscar archivo por nombre…"
    [value]="value() ?? ''"
    [selectedLabel]="selectedLabel()"
    [searchError]="error()"
    [searchFn]="searchFn"
    (select)="choose($event)"
  />
</section>
