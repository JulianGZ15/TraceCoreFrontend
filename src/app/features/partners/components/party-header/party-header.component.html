<header class="panel identity">
  <div class="identity-top">
    <a class="back-link" routerLink="/terceros">← Volver al directorio</a>
    <span class="eyebrow">Expediente de tercero · {{ party().country }}</span>
  </div>
  <div class="panel-heading">
    <div class="title-with-status">
      <h1 tabindex="-1">{{ party().legalName }}</h1>
      <tc-status [active]="party().active" />
    </div>
    <div class="row-actions">
      @for (role of roles(); track role.uuid) {
        <span class="badge neutral">{{ label(role.role) }} · {{ state(role) }}</span>
      }
    </div>
  </div>
  <div class="meta-row">
    @if (party().tradeName) {
      <span>{{ party().tradeName }}</span>
      <span aria-hidden="true">·</span>
    }
    <span class="mono">{{ party().uuid }}</span>
  </div>
  <div class="identity-nav-slot">
    <ng-content select="tc-party-sections, nav, [pageNav]" />
  </div>
</header>
