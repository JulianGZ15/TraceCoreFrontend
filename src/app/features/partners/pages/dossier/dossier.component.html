<tc-feedback [message]="error()" />
@if (error()) {
  <button class="btn secondary" (click)="load()">Reintentar consulta</button>
}
@if (ready() && store.party(); as party) {
  <tc-party-header [party]="party" [roles]="store.roles()" /><tc-party-sections
    [uuid]="party.uuid"
  /><router-outlet />
} @else {
  @if (!error()) {
    <p role="status">Cargando expediente…</p>
  }
}

@if (store.party()?.uuid; as documentSubjectUuid) { <tc-contextual-links kind="PARTY" [uuid]="documentSubjectUuid"/> }
