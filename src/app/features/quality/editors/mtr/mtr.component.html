<div class="dialog-body" [class.embedded]="!ref">
  @if (ref) {
    <tc-page-heading section="Calidad" title="Documento MTR" />
  }
  <tc-feedback [message]="error()" />
  @if (conflict()) {
    <p>Conservamos el borrador. Recarga el registro y vuelve a confirmar los cambios.</p>
    <button [disabled]="busy()" type="button" class="btn secondary" (click)="reload()">
      Recargar datos
    </button>
  }
  <form [formGroup]="form" (ngSubmit)="save()" novalidate>
    <div class="form-grid">
      <tc-quality-option
        [control]="form.controls['issuerUuid']"
        title="Emisor activo"
        kind="PARTY"
        [assetUuid]="''"
        [nullable]="false"
      /><label>Folio<input type="text" formControlName="number" /></label
      ><label>Tipo documental<input type="text" formControlName="certificateType" /></label
      ><label>Revisión<input type="text" formControlName="documentRevision" /></label
      ><label
        >Fecha y hora de emisión<tc-date-field
          id="quality-mtr-issued-at"
          label="Fecha y hora de emisión"
          mode="datetime"
          valueFormat="iso"
          [timeZone]="session.context()?.company?.timezone ?? 'UTC'"
          [required]="true"
          formControlName="issuedAt"
        /></label
      >
      <div class="wide">
        <tc-quality-evidence
          [control]="form.controls['evidenceUuid']"
          [allowUpload]="true"
          (uploadingChange)="uploadingEvidence.set($event)"
        />
      </div>
    </div>
    @if (form.invalid && form.touched) {
      <tc-feedback
        message="Revisa los datos obligatorios, UUID, intervalos y decimales."
      />
    }
    <div class="actions">
      <button
        class="btn primary"
        type="submit"
        [disabled]="busy() || uploadingEvidence() || !compatible() || !canWrite()"
      >
        {{ busy() ? 'Guardando…' : 'Guardar' }}</button
      ><button
        class="btn secondary"
        type="button"
        [disabled]="busy() || uploadingEvidence()"
        (click)="cancel()"
      >
        Cancelar
      </button>
    </div>
  </form>
</div>
