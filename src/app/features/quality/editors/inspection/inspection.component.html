<div class="dialog-body" [class.embedded]="!ref">
  @if (ref) {
    <tc-page-heading section="Calidad" title="Programar inspección" />
  }
  <tc-feedback [message]="error()" />
  @if (conflict()) {
    <p>Conservamos el borrador. Recarga el registro y vuelve a confirmar los cambios.</p>
    <button [disabled]="busy()" type="button" class="btn secondary" (click)="reload()">
      Recargar datos
    </button>
  }
  <form [formGroup]="form" (ngSubmit)="save()" novalidate>
    <div class="form-grid">
      <tc-quality-option
        [control]="form.controls['assetUuid']"
        title="Pieza"
        kind="ASSET"
        [assetUuid]="form.get('assetUuid')?.value ?? data['assetUuid'] ?? ''"
        [nullable]="false"
      /><tc-quality-option
        [control]="form.controls['policyUuid']"
        title="Política aplicable"
        kind="POLICY"
        [assetUuid]="form.get('assetUuid')?.value ?? data['assetUuid'] ?? ''"
        [nullable]="false"
      /><tc-quality-option
        [control]="form.controls['inspectorUuid']"
        title="Inspector activo"
        kind="USER"
        [assetUuid]="form.get('assetUuid')?.value ?? data['assetUuid'] ?? ''"
        [nullable]="false"
      /><label
        >Fecha y hora programada<tc-date-field
          id="quality-inspection-scheduled-at"
          label="Fecha y hora programada"
          mode="datetime"
          valueFormat="iso"
          [timeZone]="session.context()?.company?.timezone ?? 'UTC'"
          [required]="true"
          formControlName="scheduledAt"
        /></label
      ><label>Instalación<input type="text" formControlName="facility" /></label>
    </div>
    @if (form.invalid && form.touched) {
      <tc-feedback
        message="Revisa los datos obligatorios, UUID, intervalos y decimales."
      />
    }
    <div class="actions">
      <button class="btn primary" type="submit" [disabled]="busy() || !compatible() || !canWrite()">
        {{ busy() ? 'Guardando…' : 'Guardar' }}</button
      ><button class="btn secondary" type="button" [disabled]="busy()" (click)="cancel()">
        Cancelar
      </button>
    </div>
  </form>
</div>
