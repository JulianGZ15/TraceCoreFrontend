<div class="dialog-body" [class.embedded]="!ref">
  @if (ref) {
    <tc-page-heading section="Calidad" title="Registrar certificación" />
  }
  <tc-feedback [message]="error()" />
  @if (conflict()) {
    <p>Conservamos el borrador. Recarga el registro y vuelve a confirmar los cambios.</p>
    <button [disabled]="busy()" type="button" class="btn secondary" (click)="reload()">
      Recargar datos
    </button>
  }
  <form [formGroup]="form" (ngSubmit)="save()" novalidate>
    <div class="form-grid">
      <tc-quality-option
        [control]="form.controls['standardUuid']"
        title="Norma de la política"
        kind="STANDARD"
        [assetUuid]="''"
        [nullable]="false"
      /><label
        >Inspección aprobada (UUID)<input type="text" formControlName="inspectionUuid" /></label
      ><tc-quality-option
        [control]="form.controls['issuerUuid']"
        title="Emisor activo"
        kind="PARTY"
        [assetUuid]="assetReference"
        [nullable]="false"
      /><label>Folio<input type="text" formControlName="number" /></label
      ><label class="wide">Alcance<textarea formControlName="scope" rows="3"></textarea></label
      ><label>Emisión con desplazamiento UTC<input type="text" formControlName="issuedAt" /></label
      ><label
        >Vencimiento con desplazamiento UTC<input type="text" formControlName="expiresAt"
      /></label>
      <div class="wide"><tc-quality-evidence [control]="form.controls['evidenceUuid']" /></div>
    </div>
    @if (form.invalid && form.touched) {
      <tc-feedback
        message="Revisa los datos obligatorios, UUID, intervalos y decimales. Las fechas requieren Z o desplazamiento UTC."
      />
    }
    <div class="actions">
      <button class="btn primary" type="submit" [disabled]="busy() || !compatible() || !canWrite()">
        {{ busy() ? 'Guardando…' : 'Guardar' }}</button
      ><button class="btn secondary" type="button" [disabled]="busy()" (click)="cancel()">
        Cancelar
      </button>
    </div>
  </form>
</div>
