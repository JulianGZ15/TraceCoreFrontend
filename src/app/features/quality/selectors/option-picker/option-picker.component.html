<div class="picker">
  <strong>{{ title() }}</strong>
  <tc-entity-search
    [label]="title()"
    placeholder="Escribe para buscar…"
    [value]="control().value ?? ''"
    [selectedLabel]="selected()"
    [searchFn]="searchFn"
    (select)="select($event)"
  />
  <tc-feedback [message]="error()" />
  @if (nullable()) {
    <button [disabled]="busy()" type="button" class="btn secondary" (click)="unset()">
      Quitar selección
    </button>
  }
</div>
