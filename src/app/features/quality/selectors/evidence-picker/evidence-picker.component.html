<div class="picker">
  <tc-entity-search
    label="Evidencia"
    placeholder="Buscar por nombre de archivo…"
    [value]="control().value ?? ''"
    [selectedLabel]="selectedLabel()"
    [searchFn]="searchFn"
    (select)="select($event)"
  />
  <p class="small-muted">
    Utiliza una referencia documental existente. Vincularla no verifica su contenido.
  </p>
  @if (access.global('QUALITY_READ')) {
    <tc-feedback [message]="error()" />
  } @else {
    <p class="small-muted">Solicita la referencia al responsable documental.</p>
  }
</div>
