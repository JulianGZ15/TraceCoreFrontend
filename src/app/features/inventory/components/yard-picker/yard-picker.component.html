<div class="field">
  <label for="inventory-yard">Patio{{ required() ? ' *' : '' }}</label
  ><select
    id="inventory-yard"
    [ngModel]="value()"
    [required]="required()"
    [class.tc-field-invalid]="invalid()"
    [attr.aria-invalid]="invalid() ? 'true' : null"
    [attr.aria-describedby]="invalid() ? 'inventory-yard-error' : null"
    (ngModelChange)="picked.emit($event)"
  >
    @if (allowGlobal() && access.global('INVENTORY_READ')) {
      <option value="">Todos los patios</option>
    } @else {
      <option value="" disabled>Selecciona un patio</option>
    }
    @for (y of access.session.context()?.yards; track y.uuid) {
      @if (access.can('INVENTORY_READ', y.uuid)) {
        <option [value]="y.uuid">
          {{ y.code }} · {{ y.name }}{{ y.active ? '' : ' · Inactivo' }}
        </option>
      }
    }
  </select>
  @if (invalid()) {
    <small id="inventory-yard-error" class="field-error" role="alert">Selecciona un patio de origen.</small>
  }
</div>
