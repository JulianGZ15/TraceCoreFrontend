<div class="lookup">
  <tc-entity-search
    [label]="title()"
    [placeholder]="'Buscar ' + title().toLocaleLowerCase() + '…'"
    [value]="selectedId()"
    [selectedLabel]="selected() || (selectedId() ? 'Registro seleccionado' : '')"
    [searchError]="error()"
    [optionsList]="suggestions()"
    [searchFn]="searchOptions"
    [disabled]="busy()"
    (select)="choose($event)"
  />
  @if (busy()) { <p role="status">Buscando opciones…</p> }
  <tc-feedback [message]="error()" />
</div>
