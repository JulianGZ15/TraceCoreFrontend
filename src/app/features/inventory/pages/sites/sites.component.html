<tc-page-heading
  section="Inventario y patios"
  title="Sitios operativos externos"
/>
<tc-inventory-inventory-nav />
<tc-feedback [message]="error()" />
<tc-feedback [message]="success()" kind="success" />

<tc-search-toolbar
  [showSearch]="false"
  label="Filtros de sitios"
  [chips]="chips()"
  [count]="activeFilterCount()"
  [busy]="busy()"
  (openFilters)="openFilters(filterDrawerTpl)"
  (remove)="onRemoveChip($event)"
  (clear)="onClearAll()"
>
  @if (access.global('INVENTORY_MANAGE')) {
    <button toolbarAction class="btn primary" (click)="create()">Nuevo sitio</button>
  }
</tc-search-toolbar>

<ng-template #filterDrawerTpl>
  <form [formGroup]="drawerForm">
    <tc-filter-section title="Estado operativo">
      <div class="pill-group" role="group" aria-label="Estado operativo">
        <button
          type="button"
          class="pill-option"
          [class.active]="drawerForm.controls.active.value === ''"
          (click)="setDraftActive('')"
        >
          Todos
        </button>
        <button
          type="button"
          class="pill-option"
          [class.active]="drawerForm.controls.active.value === 'true'"
          (click)="setDraftActive('true')"
        >
          Activos
        </button>
        <button
          type="button"
          class="pill-option"
          [class.active]="drawerForm.controls.active.value === 'false'"
          (click)="setDraftActive('false')"
        >
          Inactivos
        </button>
      </div>
    </tc-filter-section>
  </form>
</ng-template>

<div
  class="table-scroll"
  tabindex="0"
  role="region"
  aria-label="Tabla con desplazamiento horizontal"
>
  <table>
    <thead>
      <tr>
        <th>Código / nombre</th>
        <th>Tipo</th>
        <th>Estado</th>
        <th>Acción</th>
      </tr>
    </thead>
    <tbody>
      @for (r of rows(); track r.uuid) {
        <tr>
          <td>{{ r.code }} · {{ r.name }}</td>
          <td>{{ label(r.type) }}</td>
          <td>{{ r.active ? 'Activo' : 'Inactivo' }}</td>
          <td><a [routerLink]="'/inventario/sitios/' + r.uuid">Abrir</a></td>
        </tr>
      } @empty {
        <tr>
          <td colspan="4">Sin sitios en esta página.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
<tc-pagination
  [offset]="offset()"
  [limit]="limit()"
  [count]="rows().length"
  [busy]="busy()"
  (move)="page($event)"
  (resize)="query({ limit: $event, offset: 0 })"
/>
