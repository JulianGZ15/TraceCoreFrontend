<tc-page-heading
  section="Inventario y patios"
  title="Sitios operativos externos"
/><tc-inventory-inventory-nav /><tc-feedback [message]="error()" /><tc-feedback
  [message]="success()"
  kind="success"
/>
@if (busy()) {
  <p role="status">Cargando…</p>
}
<div class="toolbar">
  <div class="field">
    <label for="site-active">Estado</label
    ><select
      id="site-active"
      [(ngModel)]="active"
      (ngModelChange)="query({ active: $event || null, offset: 0 })"
    >
      <option value="">Todos</option>
      <option value="true">Activos</option>
      <option value="false">Inactivos</option>
    </select>
  </div>
  @if (access.global('INVENTORY_MANAGE')) {
    <button class="btn primary" (click)="create()">Nuevo sitio</button>
  }
</div>
<div
  class="table-scroll"
  tabindex="0"
  role="region"
  aria-label="Tabla con desplazamiento horizontal"
>
  <table>
    <thead>
      <tr>
        <th>Código / nombre</th>
        <th>Tipo</th>
        <th>Estado</th>
        <th>Acción</th>
      </tr>
    </thead>
    <tbody>
      @for (r of rows(); track r.uuid) {
        <tr>
          <td>{{ r.code }} · {{ r.name }}</td>
          <td>{{ label(r.type) }}</td>
          <td>{{ r.active ? 'Activo' : 'Inactivo' }}</td>
          <td><a [routerLink]="'/inventario/sitios/' + r.uuid">Abrir</a></td>
        </tr>
      } @empty {
        <tr>
          <td colspan="4">Sin sitios en esta página.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
<tc-pagination
  [offset]="offset()"
  [limit]="limit()"
  [count]="rows().length"
  [busy]="busy()"
  (move)="page($event)"
  (resize)="query({ limit: $event, offset: 0 })"
/>
