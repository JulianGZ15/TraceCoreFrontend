<div class="lookup">
  @if (showLabel()) { <label [for]="id()">{{ title() }}</label> }
  <tc-entity-search
    [label]="title()"
    [controlId]="id()"
    [placeholder]="'Buscar ' + title().toLocaleLowerCase() + '…'"
    [value]="selected()"
    [selectedLabel]="selectedLabel() || selected()"
    [optionsList]="suggestions()"
    [searchFn]="searchOptions"
    [disabled]="disabled() || busy()"
    (select)="choose($event)"
  />
  @if (busy()) { <small role="status">Buscando opciones…</small> }
  @if (error()) { <small class="field-error">{{ error() }}</small> }
</div>
