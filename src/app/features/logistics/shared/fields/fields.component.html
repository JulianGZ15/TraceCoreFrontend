<div class="form-grid" [formGroup]="form()">
  @for (f of fields(); track f.key) {
    <div class="field">
      <div class="field-label-row">
        <label [for]="'logistics-' + f.key"
          >{{ f.label }}
          @if (f.required) {
            <span aria-hidden="true"> *</span>
          }
        </label>
        <tc-help-tip [term]="f.key" [label]="f.label" />
      </div>
      @switch (f.type) {
        @case ('lookup') {
          <tc-logistics-lookup
            [showLabel]="false"
            [controlId]="'logistics-' + f.key"
            [formControlName]="f.key"
            [resource]="f.resource ?? 'party-options'"
            [yard]="yard()"
            [params]="f.params ?? {}"
            [title]="f.label"
          />
        }
        @case ('textarea') {
          <textarea
            [id]="'logistics-' + f.key"
            [attr.aria-label]="f.label"
            [formControlName]="f.key"
            [attr.aria-required]="f.required ?? false"
            [readonly]="f.readonly ?? false"
            rows="3"
          ></textarea>
        }
        @case ('instant') {
          <tc-date-field
            [id]="'logistics-' + f.key"
            [label]="f.label"
            mode="datetime"
            valueFormat="iso"
            [timeZone]="timeZone"
            [required]="f.required ?? false"
            [readonly]="f.readonly ?? false"
            [invalid]="!!(form().get(f.key)?.invalid && form().get(f.key)?.touched)"
            [describedBy]="!!(form().get(f.key)?.invalid && form().get(f.key)?.touched) ? 'logistics-' + f.key + '-error' : ''"
            [formControlName]="f.key"
          />
        }
        @case ('select') {
          <select [id]="'logistics-' + f.key" [attr.aria-label]="f.label" [formControlName]="f.key">
            @for (c of f.choices ?? []; track c) {
              <option [value]="c">{{ label(c) }}</option>
            }
          </select>
        }
        @default {
          <input
            [id]="'logistics-' + f.key"
            [attr.aria-label]="f.label"
            [formControlName]="f.key"
            [attr.aria-required]="f.required ?? false"
            [readonly]="f.readonly ?? false"
            [attr.inputmode]="f.type === 'decimal' || f.type === 'integer' ? 'decimal' : null"
          />
        }
      }
      @if (form().get(f.key)?.invalid && form().get(f.key)?.touched) {
        <small class="field-error" [id]="'logistics-' + f.key + '-error'">Revisa {{ f.label.toLowerCase() }}.</small>
      }
    </div>
  }
</div>
