<tc-page-heading
  [description]="'Zona de presentación: ' + zone"
  section="Logística y despacho"
  [title]="title"
/><tc-logistics-section-nav
  [base]="navBase"
  [sections]="mode === 'manifest' ? sections : []"
/><tc-logistics-pending-requests /><tc-feedback [message]="error()" />
@if (loading()) {
  <p role="status">Cargando…</p>
}
@if (summary(); as s) {
  @if (
    access.receive(s.manifest) && ['IN_TRANSIT', 'PARTIALLY_DELIVERED'].includes(s.manifest.state)
  ) {
    <a class="btn primary" [routerLink]="['/logistica/manifiestos', id, 'recepcion']"
      >Registrar entrega</a
    >
  }
}
<tc-logistics-records
  [zone]="zone"
  [rows]="rows()"
  [columns]="columns"
  (selected)="open($event)"
/><tc-pagination
  [offset]="offset"
  [limit]="limit"
  [count]="rows().length"
  [busy]="loading()"
  (move)="move($event)"
/>
@if (selected(); as r) {
  <a class="btn secondary" [routerLink]="['/logistica/entregas', r.uuid]">Abrir entrega</a>
}
