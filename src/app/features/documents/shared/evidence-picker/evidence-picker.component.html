<div class="form-grid" [formGroup]="form">
  <div>
    <label for="document-evidence-source">Origen</label>
    <select id="document-evidence-source" formControlName="sourceKind" (change)="sourceChanged()">
      <option value="QUALITY">Calidad · biblioteca central</option><option value="PARTY">Terceros</option>
      <option value="COMMERCIAL">Comercial</option><option value="LOGISTICS">Logística</option><option value="FINANCIAL">Finanzas</option>
    </select>
  </div>
  @if (form.controls.sourceKind.value !== 'QUALITY') {
    <div>
      <label for="document-evidence-context-kind">Tipo del contexto</label>
      <select id="document-evidence-context-kind" formControlName="contextKind" (change)="chooseContext(null)">
        <option value="PARTY">Tercero</option><option value="ORDER">Orden</option>
        <option value="FRAMEWORK_CONTRACT">Contrato marco</option><option value="MANIFEST">Manifiesto</option>
      </select>
    </div>
    <tc-entity-search label="Contexto de origen" placeholder="Buscar por nombre o folio…" [value]="contextUuid()" [selectedLabel]="contextLabel()" [searchError]="error()" [searchFn]="contextSearch" (select)="chooseContext($event)" />
  }
</div>
<aside class="attention-note info" role="note">
  <strong>Se conservan los permisos del documento de origen</strong>
  La importación aplica esos permisos también a las versiones posteriores.
</aside>
<tc-feedback [message]="error()" />
<tc-entity-search label="Evidencia" placeholder="Buscar archivo por nombre…" [value]="chosen()?.uuid ?? ''" [selectedLabel]="chosen()?.filename ?? ''" [searchError]="error()" [searchFn]="evidenceSearch" [disabled]="form.controls.sourceKind.value !== 'QUALITY' && !contextUuid()" (select)="choose($event)" />
