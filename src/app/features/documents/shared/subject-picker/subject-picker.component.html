<section class="picker" [attr.aria-label]="label()">
  <tc-entity-search
    [label]="label()"
    placeholder="Nombre, código o folio…"
    [value]="chosen()?.uuid ?? value()"
    [selectedLabel]="chosen()?.label ?? ''"
    [searchError]="error()"
    [searchFn]="searchFn"
    (select)="choose($event)"
  />
  @if (error()) {
    <tc-feedback [message]="error()" />
  }
</section>
