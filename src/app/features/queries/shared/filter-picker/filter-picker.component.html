<fieldset>
  <legend>{{ label() }}</legend>
  <tc-entity-search
    [label]="label()"
    placeholder="Buscar por nombre, código o folio…"
    [value]="chosen()?.uuid ?? value()"
    [selectedLabel]="chosen()?.label ?? ''"
    [searchFn]="searchFn"
    [disabled]="busy()"
    (select)="choose($event)"
  />
  @if (error()) {
    <tc-feedback [message]="error()" />
  }
</fieldset>
