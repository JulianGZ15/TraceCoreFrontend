<img
  [src]="
    variant() === 'isotype'
      ? 'assets/brand/tracecore-isotipo.svg'
      : 'assets/brand/tracecore-colores-planos.svg'
  "
  [alt]="decorative() ? '' : 'TraceCore'"
  [attr.width]="variant() === 'isotype' ? 730 : 1300"
  [attr.height]="variant() === 'isotype' ? 490 : 710"
  [class]="'brand-logo ' + variant()"
/>
