<div class="pagination">
  <label
    >Filas
    <select [value]="limit()" (change)="resize.emit(+$any($event.target).value)">
      <option>25</option>
      <option>50</option>
      <option>100</option>
    </select></label
  ><span>{{
    count() ? 'Registros ' + (offset() + 1) + '–' + (offset() + count()) : 'Sin registros'
  }}</span>
  <div>
    <button
      type="button"
      class="btn secondary"
      [disabled]="busy() || offset() === 0"
      (click)="move.emit(offset() - limit())"
    >
      Anterior</button
    ><button
      type="button"
      class="btn secondary"
      [disabled]="busy() || (hasMore() === undefined ? count() < limit() : !hasMore())"
      (click)="move.emit(offset() + limit())"
    >
      Siguiente
    </button>
  </div>
</div>
