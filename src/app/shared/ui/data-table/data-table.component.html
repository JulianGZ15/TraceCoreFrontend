<div class="tc-table-heading">
  <ng-content select="[tableHeading]" />

<div

  role="region"
  tabindex="0"
  [attr.aria-label]="label()"

>

</div>
<div class="tc-table-footer">
  <ng-content select="[tableFooter]" />
</div>
